<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Campus Connect</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('cc-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo" aria-label="Campus Connect home">
      <img src="assets/campus-connect-logo.svg" alt="" class="logo-mark">
      <span class="logo-wordmark">Campus<span>Connect</span></span>
    </a>
    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
        <span class="theme-icon theme-icon-sun">☀️</span>
        <span class="theme-icon theme-icon-moon">🌙</span>
      </button>
    </div>
  </div>
</header>

<section class="section auth-section">
  <div class="container">
    <div class="auth-box">
      <img src="assets/campus-connect-logo.svg" alt="Campus Connect" class="auth-logo">
      <h1>Reset your password</h1>
      <p class="auth-subtitle">Enter your email address and we'll send you a link to reset your password</p>

      <form id="forgotPasswordForm" class="auth-form">
        <label for="resetEmail">Email address</label>
        <input type="email" id="resetEmail" name="email" placeholder="your@edenuniversity.education" autocomplete="email" required>

        <p class="form-msg" id="forgotPasswordMsg"></p>
        <button type="submit" id="resetBtn" class="auth-button">Send Reset Link</button>
      </form>

      <p class="auth-footer">
        Remember your password? <a href="login.html">Log in here</a>
      </p>
    </div>
  </div>
</section>

<script>
  const forgotForm = document.getElementById('forgotPasswordForm');
  const forgotMsg = document.getElementById('forgotPasswordMsg');
  const resetBtn = document.getElementById('resetBtn');

  function showMsg(msg, text, color) {
    msg.textContent = text;
    msg.style.color = color;
    msg.style.display = 'block';
  }

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('resetEmail').value.trim();
    
    if (!email || !email.includes('@')) {
      showMsg(forgotMsg, 'Please enter a valid email address.', 'var(--error)');
      return;
    }

    resetBtn.disabled = true;
    showMsg(forgotMsg, 'Sending reset link...', 'var(--text-muted)');

    try {
      const response = await fetch('api/password-recovery/request-reset.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'request_reset',
          email: email
        })
      });

      const result = await response.json();

      if (result.success) {
        showMsg(forgotMsg, 'Password reset link sent! Check your email for instructions.', 'var(--success)');
        
        // If reset_url is available (development mode), show link
        if (result.reset_url) {
          setTimeout(() => {
            window.location.href = result.reset_url;
          }, 2000);
        }
      } else {
        showMsg(forgotMsg, result.error || 'Unable to send reset link. Please try again.', 'var(--error)');
      }
    } catch (error) {
      console.error('Reset request error:', error);
      showMsg(forgotMsg, 'Network error. Please try again.', 'var(--error)');
    } finally {
      resetBtn.disabled = false;
    }
  });

  // Theme toggle
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('cc-theme', next);
  });
</script>

</body>
</html>
