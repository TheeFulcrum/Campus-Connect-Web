<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Campus Connect</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('cc-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Campus<span>Connect</span></a>
    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
        <span class="theme-icon theme-icon-sun">☀️</span>
        <span class="theme-icon theme-icon-moon">🌙</span>
      </button>
    </div>
  </div>
</header>

<section class="section auth-section">
  <div class="container">
    <div class="auth-box">
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Log in with your username or university email</p>

      <form id="loginForm" class="auth-form">
        <label for="loginIdentifier">Username or email</label>
        <input type="text" id="loginIdentifier" name="identifier" placeholder="Username or ID@edenuniversity.education" autocomplete="username" required>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" placeholder="Password" required>

        <p class="form-msg" id="loginMsg"></p>

        <button type="submit" class="btn btn-primary auth-submit">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>Campus Connect — currently piloting on select campuses.</p>
  </div>
</footer>

<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
