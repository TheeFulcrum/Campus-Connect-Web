<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing - Campus Connect</title>
    <link rel="stylesheet" href="style.css">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cc-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <!-- Splash Screen -->
    <style>
      .startup-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.6s ease-out;
        backdrop-filter: blur(2px);
      }
      .startup-splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .startup-splash-inner {
        text-align: center;
        animation: pulse 2s ease-in-out infinite;
        user-select: none;
      }
      .startup-splash-logo {
        width: 100px;
        height: 100px;
        max-width: 100px;
        max-height: 100px;
        margin-bottom: 24px;
        opacity: 1;
        object-fit: contain;
        object-position: center;
        filter: drop-shadow(0 2px 8px rgba(36, 59, 107, 0.15));
      }
      [data-theme="dark"] .startup-splash-logo {
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.3));
      }
      .startup-splash-name {
        font-size: 28px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.8px;
        line-height: 1.2;
      }
      .startup-splash-name span {
        display: inline-block;
      }
      .startup-splash-name .primary {
        color: var(--primary);
      }
      .startup-splash-name .accent {
        color: var(--accent);
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.02); opacity: 0.95; }
      }
    </style>
    <script>
      (function() {
        try {
          var navigationEntry = window.performance && performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
          var navigationType = navigationEntry ? navigationEntry.type : 'navigate';
          var showStartupSplash = navigationType === 'reload';
          var welcomeName = '';
          
          try {
            welcomeName = sessionStorage.getItem('cc-welcome-splash') || '';
            if (welcomeName) sessionStorage.removeItem('cc-welcome-splash');
            var hasVisitedTab = sessionStorage.getItem('cc-splash-seen') === '1';
            showStartupSplash = showStartupSplash || Boolean(welcomeName) || (!hasVisitedTab && navigationType === 'navigate');
            if (showStartupSplash) sessionStorage.setItem('cc-splash-seen', '1');
          } catch (e) {
            showStartupSplash = navigationType !== 'back_forward';
          }
          
          if (showStartupSplash) {
            var splash = document.createElement('div');
            splash.className = 'startup-splash';
            splash.setAttribute('role', 'status');
            splash.setAttribute('aria-label', 'Loading Campus Connect');
            
            var safeWelcomeName = (welcomeName || '').replace(/[&<>"']/g, function (c) {
              return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
            });
            
            var splashLabel = safeWelcomeName ? 'Welcome, <span class="accent">' + safeWelcomeName + '</span>' : '<span class="primary">Campus</span><span class="accent">Connect</span>';
            splash.innerHTML = '<div class="startup-splash-inner"><img class="startup-splash-logo" src="assets/campus-connect-logo.svg" alt=""><div class="startup-splash-name">' + splashLabel + '</div></div>';
            
            document.documentElement.appendChild(splash);
            window.campusSplashScreen = splash;
            
            setTimeout(function() {
              if (window.campusSplashScreen) {
                window.campusSplashScreen.classList.add('fade-out');
                setTimeout(function() {
                  if (window.campusSplashScreen && window.campusSplashScreen.parentNode) {
                    window.campusSplashScreen.parentNode.removeChild(window.campusSplashScreen);
                  }
                }, 600);
              }
            }, 2500);
          }
        } catch (e) {
          console.error('Splash screen error:', e);
        }
      })();
    </script>
    <style>
        .form-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .form-actions button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-submit {
            background: var(--primary);
            color: white;
        }
        .btn-cancel {
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .form-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .form-message.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            display: block;
        }
        .form-message.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
            display: block;
        }
        .image-dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            min-height: 44px;
        }
        .image-dropzone:hover,
        .image-dropzone:focus-visible,
        .image-dropzone.is-dragover {
            border-color: var(--primary);
            outline: none;
        }
        .image-dropzone p { margin: 0; color: var(--text-muted); }
        .dropzone-link { color: var(--primary); font-weight: 600; }
        .image-preview-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }
        .image-preview {
            position: relative;
            width: 84px;
            height: 84px;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .image-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .image-preview-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: var(--primary-dark);
            color: var(--surface);
            cursor: pointer;
            line-height: 1;
        }
        .image-progress-wrap {
            margin-top: 12px;
            height: 6px;
            border-radius: var(--radius);
            background: var(--border);
            overflow: hidden;
        }
        .image-progress-bar {
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width .2s ease;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="home.html" class="logo" aria-label="Campus Connect home">
                <img src="assets/campus-connect-logo.svg" alt="" class="logo-mark">
                <span class="logo-wordmark">Campus<span>Connect</span></span>
            </a>
            <nav class="nav-links">
                <a href="home.html">Home</a>
                <a href="listings.html">Listings</a>
                <a href="profile.html">Profile</a>
                <a href="messages.html">Messages</a>
            </nav>
            <div class="header-actions">
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
                    <span class="theme-icon theme-icon-sun">☀️</span>
                    <span class="theme-icon theme-icon-moon">🌙</span>
                </button>
                <button id="logoutBtn" class="btn btn-outline nav-cta" type="button">Log Out</button>
            </div>
        </div>
    </header>

    <div class="form-container">
        <h1 style="margin-bottom: 20px;">Post a New Listing</h1>
        
        <div class="form-message" id="formMessage"></div>

        <form id="createListingForm">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" placeholder="e.g., Physics Textbook - Halliday & Resnick" maxlength="160" required>
                <div class="form-hint" id="titleHint">0 / 160 characters</div>
            </div>

            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="Textbooks">Textbooks</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Services">Services</option>
                    <option value="Housing">Housing</option>
                    <option value="Rides">Rides</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="campus">Campus *</label>
                <select id="campus" name="campus" required>
                    <option value="">Select your campus</option>
                    <option value="Main Campus">Main Campus</option>
                    <option value="Great East Campus">Great East Campus</option>
                </select>
            </div>

            <div class="form-group">
                <label for="price">Price (optional)</label>
                <input type="number" id="price" name="price" placeholder="0.00" step="0.01" min="0">
                <div class="form-hint">Leave empty if free or by negotiation</div>
            </div>

            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" name="description" placeholder="Describe your item in detail..." required></textarea>
                <div class="form-hint" id="descHint">Details help buyers find what they need</div>
            </div>

            <div class="form-group">
                <label>Photos (optional, up to 10)</label>
                <div id="imageDropzone" class="image-dropzone" role="button" tabindex="0" aria-label="Add listing photos">
                    <p>Drag &amp; drop images here, or <span class="dropzone-link">browse</span></p>
                    <p class="form-hint">JPG, PNG, WebP or GIF — max 5MB each</p>
                </div>
                <input type="file" id="imageFiles" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
                <div id="imagePreviewRow" class="image-preview-row"></div>
                <div id="imageProgressWrap" class="image-progress-wrap" hidden>
                    <div id="imageProgressBar" class="image-progress-bar"></div>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="window.location.href='listings.html';">Cancel</button>
                <button type="submit" class="btn-submit">Post Listing</button>
            </div>
        </form>
    </div>

    <script>
        const token = sessionStorage.getItem('cc-auth-token');
        if (!token) {
            window.location.href = 'login.html';
        }

        const titleInput = document.getElementById('title');
        const titleHint = document.getElementById('titleHint');
        const formMessage = document.getElementById('formMessage');
        const form = document.getElementById('createListingForm');

        // --- Image upload: drag-and-drop, previews, progress, then URLs passed as image_ids ---
        const dropzone = document.getElementById('imageDropzone');
        const fileInput = document.getElementById('imageFiles');
        const previewRow = document.getElementById('imagePreviewRow');
        const progressWrap = document.getElementById('imageProgressWrap');
        const progressBar = document.getElementById('imageProgressBar');
        let pendingFiles = [];
        const MAX_IMAGES = 10;
        const MAX_BYTES = 5 * 1024 * 1024;

        function addFiles(fileList) {
            Array.from(fileList).forEach(function(file) {
                if (pendingFiles.length >= MAX_IMAGES) { showMessage('You can add at most ' + MAX_IMAGES + ' images.', 'error'); return; }
                if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) { showMessage(file.name + ': only JPG, PNG, WebP or GIF images are allowed.', 'error'); return; }
                if (file.size > MAX_BYTES) { showMessage(file.name + ' is larger than 5MB.', 'error'); return; }
                pendingFiles.push(file);
                renderPreview(file, pendingFiles.length - 1);
            });
        }

        function renderPreview(file, index) {
            const wrap = document.createElement('div');
            wrap.className = 'image-preview';
            const img = document.createElement('img');
            img.alt = file.name;
            img.src = URL.createObjectURL(file);
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'image-preview-remove';
            removeBtn.setAttribute('aria-label', 'Remove image');
            removeBtn.textContent = '×';
            removeBtn.addEventListener('click', function() {
                pendingFiles[index] = null;
                wrap.remove();
            });
            wrap.appendChild(img);
            wrap.appendChild(removeBtn);
            previewRow.appendChild(wrap);
        }

        dropzone.addEventListener('click', function() { fileInput.click(); });
        dropzone.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
        fileInput.addEventListener('change', function() { addFiles(fileInput.files); fileInput.value = ''; });
        ['dragenter', 'dragover'].forEach(function(evt) {
            dropzone.addEventListener(evt, function(e) { e.preventDefault(); dropzone.classList.add('is-dragover'); });
        });
        ['dragleave', 'drop'].forEach(function(evt) {
            dropzone.addEventListener(evt, function(e) { e.preventDefault(); dropzone.classList.remove('is-dragover'); });
        });
        dropzone.addEventListener('drop', function(e) { if (e.dataTransfer) addFiles(e.dataTransfer.files); });

        function uploadImages() {
            const files = pendingFiles.filter(Boolean);
            if (!files.length) return Promise.resolve([]);
            const data = new FormData();
            files.forEach(function(f) { data.append('images[]', f); });
            progressWrap.hidden = false;
            progressBar.style.width = '0%';
            return new Promise(function(resolve, reject) {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'api/listings/upload-images.php');
                xhr.setRequestHeader('Authorization', 'Bearer ' + token);
                xhr.upload.addEventListener('progress', function(e) {
                    if (e.lengthComputable) progressBar.style.width = Math.round((e.loaded / e.total) * 100) + '%';
                });
                xhr.onload = function() {
                    progressWrap.hidden = true;
                    try {
                        const result = JSON.parse(xhr.responseText);
                        if (xhr.status < 400 && result.success) {
                            resolve((result.images || []).map(function(img) { return img.image_url; }));
                        } else {
                            reject(new Error(result.error || 'Image upload failed.'));
                        }
                    } catch (err) { reject(new Error('Image upload failed.')); }
                };
                xhr.onerror = function() { progressWrap.hidden = true; reject(new Error('Image upload failed.')); };
                xhr.send(data);
            });
        }

        titleInput.addEventListener('input', function() {
            titleHint.textContent = this.value.length + ' / 160 characters';
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const category = document.getElementById('category').value.trim();
            const campus = document.getElementById('campus').value.trim();
            const price = document.getElementById('price').value;

            if (!title || !description || !category || !campus) {
                showMessage('All fields marked with * are required.', 'error');
                return;
            }

            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Posting...';

            try {
                const imageUrls = await uploadImages();
                const response = await fetch('api/listings/create.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        action: 'create_listing',
                        title: title,
                        description: description,
                        category: category,
                        campus: campus,
                        price: price ? parseFloat(price) : null,
                        image_ids: imageUrls
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showMessage('Listing posted successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'listings.html';
                    }, 2000);
                } else {
                    showMessage(result.error || 'Failed to post listing.', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Post Listing';
            }
        });

        function showMessage(msg, type) {
            formMessage.className = 'form-message ' + type;
            formMessage.textContent = msg;
        }
    </script>
</body>
</html>
