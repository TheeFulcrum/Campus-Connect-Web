<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing - Campus Connect</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .form-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .form-actions button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-submit {
            background: var(--primary);
            color: white;
        }
        .btn-cancel {
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .form-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .form-message.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            display: block;
        }
        .form-message.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
            display: block;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo" aria-label="Campus Connect">
                <img src="assets/campus-connect-logo.svg" alt="" class="logo-mark">
                <span class="logo-wordmark">Campus<span>Connect</span></span>
            </div>
            <nav class="nav-links">
                <a href="home.html">Home</a>
                <a href="listings.html">Listings</a>
                <a href="profile.html">Profile</a>
                <a href="messages.html">Messages</a>
                <a href="logout.php" class="btn btn-outline nav-cta">Log Out</a>
            </nav>
        </div>
    </header>

    <div class="form-container">
        <h1 style="margin-bottom: 20px;">Post a New Listing</h1>
        
        <div class="form-message" id="formMessage"></div>

        <form id="createListingForm">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" placeholder="e.g., Physics Textbook - Halliday & Resnick" maxlength="160" required>
                <div class="form-hint" id="titleHint">0 / 160 characters</div>
            </div>

            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="Textbooks">Textbooks</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Services">Services</option>
                    <option value="Housing">Housing</option>
                    <option value="Rides">Rides</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="campus">Campus *</label>
                <select id="campus" name="campus" required>
                    <option value="">Select your campus</option>
                    <option value="Main Campus">Main Campus</option>
                    <option value="Great East Campus">Great East Campus</option>
                </select>
            </div>

            <div class="form-group">
                <label for="price">Price (optional)</label>
                <input type="number" id="price" name="price" placeholder="0.00" step="0.01" min="0">
                <div class="form-hint">Leave empty if free or by negotiation</div>
            </div>

            <div class="form-group">
                <label for="description">Description *</label>
                <textarea id="description" name="description" placeholder="Describe your item in detail..." required></textarea>
                <div class="form-hint" id="descHint">Details help buyers find what they need</div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="window.location.href='listings.html';">Cancel</button>
                <button type="submit" class="btn-submit">Post Listing</button>
            </div>
        </form>
    </div>

    <script>
        const token = sessionStorage.getItem('cc-auth-token');
        if (!token) {
            window.location.href = 'login.html';
        }

        const titleInput = document.getElementById('title');
        const titleHint = document.getElementById('titleHint');
        const formMessage = document.getElementById('formMessage');
        const form = document.getElementById('createListingForm');

        titleInput.addEventListener('input', function() {
            titleHint.textContent = this.value.length + ' / 160 characters';
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const category = document.getElementById('category').value.trim();
            const campus = document.getElementById('campus').value.trim();
            const price = document.getElementById('price').value;

            if (!title || !description || !category || !campus) {
                showMessage('All fields marked with * are required.', 'error');
                return;
            }

            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Posting...';

            try {
                const response = await fetch('api/listings/create.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        action: 'create_listing',
                        title: title,
                        description: description,
                        category: category,
                        campus: campus,
                        price: price ? parseFloat(price) : null
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showMessage('Listing posted successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'listings.html';
                    }, 2000);
                } else {
                    showMessage(result.error || 'Failed to post listing.', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Post Listing';
            }
        });

        function showMessage(msg, type) {
            formMessage.className = 'form-message ' + type;
            formMessage.textContent = msg;
        }
    </script>
</body>
</html>
