<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Post — Campus Connect</title><link rel="stylesheet" href="style.css"><script>(function(){try{var saved=localStorage.getItem('cc-theme');var theme=saved||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',theme);}catch(e){}}());</script></head><body>
<header class="site-header"><div class="container header-inner"><a href="home.html" class="logo" aria-label="Campus Connect home"><img src="assets/campus-connect-logo.svg" alt="" class="logo-mark"><span class="logo-wordmark">Campus<span>Connect</span></span></a><div class="header-actions"><button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" type="button"><span class="theme-icon theme-icon-sun">☀️</span><span class="theme-icon theme-icon-moon">🌙</span></button><button id="logoutBtn" class="btn btn-outline nav-cta" type="button">Log Out</button></div></div></header>
<main class="preferences-shell"><section class="listing-modal route-post-card"><p class="eyebrow">Put it out there</p><h1>Create a listing</h1><p class="modal-subtitle">Share something useful with your campus.</p><form id="routeListingForm" class="listing-form"><label>What are you offering?<input id="routeTitle" type="text" placeholder="e.g. Organic Chemistry notes" required></label><label>Category<select id="routeCategory"><option value="services">Service</option><option value="goods">For sale</option><option value="gigs">Gig</option></select></label><label>Price or rate<input id="routePrice" type="text" placeholder="e.g. K80 or Free" required></label><label>Short description<textarea id="routeDescription" rows="4" placeholder="Add the useful details..."></textarea></label><p class="form-msg" id="routePostMessage"></p><button class="btn btn-primary auth-submit" type="submit">Post listing</button></form></section></main>
<nav class="bottom-nav" aria-label="Main navigation"><a class="bottom-nav-item" href="home.html"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span><span>Home</span></a><a class="bottom-nav-item" href="adverts.html"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span><span>Adverts</span></a><a class="bottom-nav-item bottom-nav-post is-active" href="post.html" aria-current="page"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>Post</span></a><a class="bottom-nav-item" href="messages.html"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.5 8.5 0 0 1-4-.9L4 20l1.2-3.3A7.2 7.2 0 0 1 4 12.5 7.5 7.5 0 0 1 12 5a7.5 7.5 0 0 1 8 6.5z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg></span><span>Messages</span></a><a class="bottom-nav-item" href="profile.html"><span class="bottom-nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><span>Profile</span></a></nav>
