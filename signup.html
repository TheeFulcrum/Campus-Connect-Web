<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Campus Connect</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('cc-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo" aria-label="Campus Connect home">
      <img src="assets/campus-connect-logo.svg" alt="" class="logo-mark">
      <span class="logo-wordmark">Campus<span>Connect</span></span>
    </a>
    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
        <span class="theme-icon theme-icon-sun">☀️</span>
        <span class="theme-icon theme-icon-moon">🌙</span>
      </button>
    </div>
  </div>
</header>

<section class="section auth-section">
  <div class="container">
    <div class="auth-box">
      <img src="assets/campus-connect-logo.svg" alt="Campus Connect" class="auth-logo">
      <h1>Create your account</h1>
      <p class="auth-subtitle">Join the Campus Connect community</p>

      <form id="signupForm" class="auth-form">
        <label for="signupCampus">Campus Location</label>
        <select id="signupCampus" name="campus" required>
          <option value="Main Campus">Main Campus</option>
          <option value="Great East Campus">Great East Campus</option>
        </select>

        <div class="signup-avatar-row">
          <div class="signup-avatar-preview" id="signupAvatarPreview">CC</div>
          <label class="signup-avatar-upload">
            <span>Profile picture</span>
            <small>JPG/PNG, max 500KB</small>
            <input type="file" id="signupAvatar" accept="image/*" hidden>
          </label>
        </div>

        <label for="signupRealName">Real name</label>
        <input type="text" id="signupRealName" name="real_name" placeholder="e.g. Methembe Nyathi" maxlength="40">

        <label for="signupUsername">Username</label>
        <input type="text" id="signupUsername" name="username" placeholder="Choose a username" minlength="3" required>

        <label for="signupEmail">University Email</label>
        <input type="email" id="signupEmail" name="email" placeholder="ID@edenuniversity.education" required>

        <label for="signupBio">Bio <span class="label-hint">(optional)</span></label>
        <textarea id="signupBio" name="bio" rows="3" maxlength="150" placeholder="Memento mori — short bio, what you hustle on campus..."></textarea>
        <span class="char-hint" id="bioHint">0 / 150</span>

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" name="password" placeholder="Password (min 8 characters)" minlength="8" required>

        <label for="signupConfirm">Confirm Password</label>
        <input type="password" id="signupConfirm" name="confirm" placeholder="Confirm password" minlength="8" required>

        <p class="form-msg" id="signupMsg"></p>

        <button type="submit" class="btn btn-primary auth-submit">Sign Up</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>Campus Connect — currently piloting on select campuses.</p>
  </div>
</footer>

<script src="script.js"></script>
<script src="auth.js"></script>
</body>
</html>
