<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Campus Connect</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('cc-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo" aria-label="Campus Connect home">
      <img src="assets/campus-connect-logo.svg" alt="" class="logo-mark">
      <span class="logo-wordmark">Campus<span>Connect</span></span>
    </a>
    <div class="header-actions">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
        <span class="theme-icon theme-icon-sun">☀️</span>
        <span class="theme-icon theme-icon-moon">🌙</span>
      </button>
    </div>
  </div>
</header>

<section class="section auth-section">
  <div class="container">
    <div class="auth-box">
      <img src="assets/campus-connect-logo.svg" alt="Campus Connect" class="auth-logo">
      <h1>Create a new password</h1>
      <p class="auth-subtitle" id="resetEmailDisplay"></p>

      <form id="resetPasswordForm" class="auth-form">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" minlength="8" autocomplete="new-password" required>

        <p class="form-msg" id="resetPasswordMsg"></p>
        <button type="submit" id="submitBtn" class="auth-button">Reset Password</button>
      </form>

      <p class="auth-footer">
        <a href="login.html">Back to Log In</a>
      </p>
    </div>
  </div>
</section>

<script>
  const resetForm = document.getElementById('resetPasswordForm');
  const resetMsg = document.getElementById('resetPasswordMsg');
  const submitBtn = document.getElementById('submitBtn');
  const emailDisplay = document.getElementById('resetEmailDisplay');
  const newPwInput = document.getElementById('newPassword');
  const confirmPwInput = document.getElementById('confirmPassword');

  let resetToken = '';

  function showMsg(msg, text, color) {
    msg.textContent = text;
    msg.style.color = color;
    msg.style.display = 'block';
  }

  // Get token from URL
  function getResetToken() {
    const params = new URLSearchParams(window.location.search);
    return params.get('token') || '';
  }

  // Verify token on page load
  async function verifyToken() {
    resetToken = getResetToken();

    if (!resetToken) {
      showMsg(resetMsg, 'No reset token provided. Please request a new password reset link.', 'var(--error)');
      submitBtn.disabled = true;
      return;
    }

    showMsg(resetMsg, 'Verifying reset link...', 'var(--text-muted)');

    try {
      const response = await fetch('api/password-recovery/verify-token.php?token=' + encodeURIComponent(resetToken));
      const result = await response.json();

      if (result.success) {
        resetMsg.style.display = 'none';
        emailDisplay.textContent = 'Resetting password for: ' + (result.email || 'your account');
        submitBtn.disabled = false;
      } else {
        showMsg(resetMsg, result.error || 'Invalid or expired reset link. Please request a new one.', 'var(--error)');
        submitBtn.disabled = true;
      }
    } catch (error) {
      console.error('Token verification error:', error);
      showMsg(resetMsg, 'Network error. Please try again.', 'var(--error)');
      submitBtn.disabled = true;
    }
  }

  // Handle form submission
  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const newPassword = newPwInput.value;
    const confirmPassword = confirmPwInput.value;

    // Validate inputs
    if (!newPassword || newPassword.length < 8) {
      showMsg(resetMsg, 'Password must be at least 8 characters long.', 'var(--error)');
      return;
    }

    if (newPassword !== confirmPassword) {
      showMsg(resetMsg, 'Passwords do not match.', 'var(--error)');
      return;
    }

    if (!resetToken) {
      showMsg(resetMsg, 'Invalid reset token. Please request a new password reset.', 'var(--error)');
      return;
    }

    submitBtn.disabled = true;
    showMsg(resetMsg, 'Resetting your password...', 'var(--text-muted)');

    try {
      const response = await fetch('api/password-recovery/reset-password.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'reset_password',
          token: resetToken,
          password: newPassword
        })
      });

      const result = await response.json();

      if (result.success) {
        showMsg(resetMsg, 'Password reset successful! Redirecting to login...', 'var(--success)');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } else {
        showMsg(resetMsg, result.error || 'Unable to reset password. Please try again.', 'var(--error)');
        submitBtn.disabled = false;
      }
    } catch (error) {
      console.error('Password reset error:', error);
      showMsg(resetMsg, 'Network error. Please try again.', 'var(--error)');
      submitBtn.disabled = false;
    }
  });

  // Theme toggle
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('cc-theme', next);
  });

  // Verify token on load
  verifyToken();
</script>

</body>
</html>
