<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Messages — Campus Connect</title><link rel="stylesheet" href="style.css"><script>(function(){try{var saved=localStorage.getItem('cc-theme');var theme=saved||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',theme);}catch(e){}}());</script></head><body>
<header class="site-header"><div class="container header-inner"><a href="home.html" class="logo" aria-label="Campus Connect home"><img src="assets/campus-connect-logo.svg" alt="" class="logo-mark"><span class="logo-wordmark">Campus<span>Connect</span></span></a><div class="header-actions"><button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" type="button"><span class="theme-icon theme-icon-sun">☀️</span><span class="theme-icon theme-icon-moon">🌙</span></button><button id="logoutBtn" class="btn btn-outline nav-cta" type="button">Log Out</button></div></div></header>
<main class="marketplace-shell"><div class="container"><section class="app-panel messages-page"><div class="panel-heading"><div><p class="eyebrow">Stay in the loop</p><h1>Messages</h1><p>Keep every campus conversation in one place.</p></div><span class="panel-count" id="messageCount">0</span></div><div class="messages-layout"><div class="conversation-list" id="conversationList"></div><section class="chat-panel" id="chatPanel" hidden><div class="chat-heading"><div class="conversation-avatar avatar-navy" id="chatAvatar">CC</div><div><strong id="chatName">Conversation</strong><small id="chatListing">Campus listing</small></div></div><div class="chat-messages" id="chatMessages"></div><form class="chat-form" id="chatForm"><input id="chatInput" type="text" maxlength="500" placeholder="Write a message..." required><button class="btn btn-primary" type="submit">Send</button></form></section><div class="chat-empty" id="chatEmpty"><span class="empty-panel-icon">✦</span><h3>Select a conversation</h3><p>Choose a conversation to reply.</p></div></div><div class="messages-tip"><span>✦</span><p>Keep conversations in-app until you have agreed on a safe campus meeting point.</p></div></section></div></main>
